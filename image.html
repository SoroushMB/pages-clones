<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Image Search</title>
    <link rel="stylesheet" href="./static/image.css">
</head>
<body>
    <header class="header">
        <a href="index.html">Normal Search</a>
        <a href="advanced.html">Advanced Search</a>
    </header>

    <main class="main-content">
        <div class="main-logo">
            <img src="/assets/images/google.png" alt="Google Logo" height="110">
            <div class="logo-subtext">
                <span>images</span>
            </div>
        </div>

        <form action="https://www.google.com/search" method="get" class="search-container">
            <input type="text" class="search-bar">
            <div class="button-container">
                <input class="search-button" type="submit" value="Google Search">
                <input class="lucky-button" type="submit" name="btnI" value="I'm Feeling Lucky">
            </div>
        </form>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-country">United States Of America</div>
            <div class="footer-links">
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search Works</a>
            </div>
        </div>
    </footer>
</body>
</html>
