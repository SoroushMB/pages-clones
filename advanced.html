<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Search</title>
    <link rel="stylesheet" href="./static/advanced.css">
</head>
<body>
  <header class="header">
    <a href="image.html">Image Search</a>
    <a href="index.html">Normal Search</a>
  </header>

  <main class="main-content">
    <form action="https://www.google.com/search" method="get" class="search-container">
      <table class="text-input-table">
        <tr><td><h4>Find pages with...</h4></td></tr>
        <tr>
          <td>All of these words: </td>
          <td> <input type="text" name="as_q" class="searchbar-sm"> </td>
        </tr>
        <tr>
          <td>This exact word or phrase: </td>
          <td> <input type="text" name="as_qpq" class="searchbar-sm"> </td>
        </tr>
        <tr>
          <td>Any of these words: </td>
          <td> <input type="text" name="as_oq" class="searchbar-sm"> </td>
        </tr>
        <tr>
          <td>This exact word or phrase: </td>
          <td> <input type="text" name="as_epq" class="searchbar-sm"> </td>
        </tr>
        <tr>
          <td>None of these words: </td>
          <td> <input type="text" name="as_eq" class="searchbar-sm"> </td>
        </tr>
        <tr>
          <td></td>
          <td> <input type="submit" value="Advanced Search" class="searchbutton"></td>
        </tr>
      </table>
    </form>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-country">United States Of America</div>
      <div class="footer-links">
        <a href="#">Advertising</a>
        <a href="#">Business</a>
        <a href="#">How Search Works</a>
      </div>
    </div>
  </footer>
</body>
</html>
